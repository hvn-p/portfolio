# Every pull request and every commit on main is linted and built; the build
# also type-checks. The mockup comparison bench stays local: it needs two
# browsers and the Google Fonts CDN the mockup loads.
#
# Actions are pinned by commit rather than by tag: a tag is a moving target its
# owner can repoint (see the tj-actions/changed-files leak, 2025).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

