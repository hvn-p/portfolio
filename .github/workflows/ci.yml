# Every pull request and every commit on main is linted and built; the build
# also type-checks. The mockup comparison bench stays local: it needs two
# browsers and the Google Fonts CDN the mockup loads.
#
# Actions are pinned by commit rather than by tag: a tag is a moving target its
# owner can repoint (see the tj-actions/changed-files leak, 2025).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  # Builds the site image without pushing it: publishing and deploying wait for
  # the domain and the Dokploy application.
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
